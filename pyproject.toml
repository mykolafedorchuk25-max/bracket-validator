[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Назва на (Test)PyPI має бути унікальною — додайте свій суфікс!
name = "bracket-validator-mykola"
version = "0.1.0"
description = "Валідатор балансу дужок (), {}, <> на основі стека"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
bracket-validator = "bracket_validator.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bracket_validator"]
